#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------
listen_addresses = '127.0.0.1,${JAIL_IP}'
port = ${PG_PORT}
max_connections = 100
superuser_reserved_connections = 3

unix_socket_directories = '/var/run/postgresql'           
unix_socket_permissions = 0770

# - TCP settings -
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# - Authentication -
authentication_timeout = 1min          # 1s-600s
password_encryption = scram-sha-256    # scram-sha-256 or (deprecated) md5

# - SSL -

#ssl = off
#ssl_ca_file = ''
#ssl_cert_file = 'server.crt'
#ssl_crl_file = ''
#ssl_crl_dir = ''
#ssl_key_file = 'server.key'
#ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'       # allowed TLSv1.2 ciphers
#ssl_tls13_ciphers = '' # allowed TLSv1.3 cipher suites, blank for default
#ssl_prefer_server_ciphers = on
#ssl_groups = 'X25519:prime256v1'
#ssl_min_protocol_version = 'TLSv1.2'
#ssl_max_protocol_version = ''
#ssl_dh_params_file = ''
#ssl_passphrase_command = ''
#ssl_passphrase_command_supports_reload = off


#------------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
#------------------------------------------------------------------------------
# - Memory -
shared_buffers = 2GB
huge_pages = try
temp_buffers = 16MB
work_mem = 16MB
hash_mem_multiplier = 2.0
maintenance_work_mem = 512MB 
autovacuum_work_mem = 256MB
logical_decoding_work_mem = 64MB

dynamic_shared_memory_type = posix

# - Disk -
temp_file_limit = 4GB


# - Kernel Resources -
max_files_per_process = 1000

# - Background Writer -
bgwriter_delay = 100ms
bgwriter_lru_maxpages   = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after    = 512kB 

# - I/O -
io_method      = worker
backend_flush_after         = 256kB
effective_io_concurrency    = 2
maintenance_io_concurrency  = 2

# - Worker Processes -
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_parallel_workers = 8

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------
wal_level = replica
fsync = on
synchronous_commit = on
wal_sync_method = fdatasync
full_page_writes = on
wal_compression = lz4
wal_buffers = 64MB
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# - Checkpoints -
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 256kB
checkpoint_warning = 30s
max_wal_size = 1GB
min_wal_size = 80MB

# - Archiving -
#archive_mode = on
#archive_command = 'test ! -f /mnt/pgarchive/%f && cp %p /mnt/pgarchive/%f'
#archive_timeout = 300

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------
#max_wal_senders       = 3
#max_replication_slots = 3
#wal_keep_size         = 256
#wal_sender_timeout    = 60s

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------
# - Planner Cost Constants -
seq_page_cost = 1.0
random_page_cost = 1.5
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025
parallel_setup_cost = 1000.0
parallel_tuple_cost = 0.1
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
max_connections = 100
wal_level = replica

# -- JIT (Java-free, LLVM-based) --
jit                     = on
jit_above_cost          = 100000
jit_inline_above_cost   = 500000
jit_optimize_above_cost = 500000

#------------------------------------------------------------------------------
# REPORTING AND LOGGING
#------------------------------------------------------------------------------
log_destination   = 'syslog'
syslog_facility = 'LOCAL0'
syslog_ident = 'postgres'
syslog_sequence_numbers = on
syslog_split_messages = on

# This is only relevant when logging to eventlog (Windows):
# (change requires restart)
#event_source = 'PostgreSQL'

# - When to Log -
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000

# - What to Log -
log_autovacuum_min_duration = 250ms
log_checkpoints = on
log_connections = 'all'
log_disconnections = on
log_error_verbosity = default
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 10MB
log_timezone = 'Asia/Jakarta'

#------------------------------------------------------------------------------
# STATISTICS
#------------------------------------------------------------------------------
track_activities = on
track_activity_query_size = 2048  
track_counts = on
track_io_timing = on
track_wal_io_timing = on
track_functions = pl
compute_query_id = on

#------------------------------------------------------------------------------
# VACUUMING
#------------------------------------------------------------------------------
autovacuum                      = on
autovacuum_worker_slots         = 16
autovacuum_max_workers          = 4
autovacuum_naptime              = 30s
autovacuum_vacuum_threshold     = 50
autovacuum_analyze_threshold    = 50
autovacuum_vacuum_scale_factor  = 0.05
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay    = 2ms
autovacuum_vacuum_cost_limit    = 400
autovacuum_freeze_max_age       = 200000000

vacuum_cost_delay       = 0
vacuum_cost_limit       = 800

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# -- Locale & Timezone --
datestyle                  = 'iso, dmy'
timezone                   = 'Asia/Jakarta'
lc_messages                = 'C.UTF-8'
lc_monetary                = 'C.UTF-8'
lc_numeric                 = 'C.UTF-8'
lc_time                    = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# -- Session Timeouts --
statement_timeout              = 0
lock_timeout                   = 5000
idle_in_transaction_session_timeout = 30000
idle_session_timeout           = 0

# -- Compression --
default_toast_compression       = 'lz4'

# -- Preload Libraries --
shared_preload_libraries = 'pg_stat_statements'

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------
deadlock_timeout        = 1s
max_locks_per_transaction = 64
